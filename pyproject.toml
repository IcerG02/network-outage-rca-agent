[project]
name = "rca-agent"
version = "0.1.0"
description = "LangGraph agent that builds a root-cause dossier for network outages"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
llm = ["langchain-anthropic>=0.3"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
